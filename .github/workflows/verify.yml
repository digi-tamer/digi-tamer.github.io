# 랭킹 리플레이 검증 (공개 저장소에서 돈다 — 공개 저장소 Actions 는 무료)
#  · 검증 대기에 기록이 들어오면 Supabase 가 바로 실행 (repository_dispatch) + 놓친 것은 10분마다
#  · verifier/replay-<버전>.mjs : 그 버전 게임 규칙 · verifier/run.mjs : 검증기 (배포 때 tools/build-verifier.mjs 가 만든다)
#  · 원본: digi-tamer-dev/tools/site-workflows/verify.yml (배포 때 복사된다 — 여기서 고치지 말 것)
name: 랭킹 검증
on:
  repository_dispatch:
    types: [verify]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
concurrency:
  group: verify
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: verifier
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node verifier/run.mjs
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VERIFY_BUNDLES: ${{ github.workspace }}/verifier
