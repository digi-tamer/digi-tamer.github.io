<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="디지 테이머" />
    <meta name="application-name" content="디지 테이머" />
    <meta name="theme-color" content="#151a2a" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap" rel="stylesheet" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <title>디지 테이머 · 랜덤 디펜스</title>
    <script type="module" crossorigin src="./assets/index-DHd2jICg.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DTSl3woA.css">
  </head>
  <body>
    <!-- 1280×720 고정 무대: 창 크기에 맞춰 통째로 확대/축소 -->
    <div id="wrap">
    <div id="stage">
    <canvas id="view"></canvas>

    <header id="topbar">
      <div id="stage-info"></div>
      <div id="wave"></div>
      <div id="bosses"></div>
      <div class="spacer"></div>
      <div class="res" title="내 필드 적 수 / 패배 한도"><img class="ico" data-img="boss" alt=""><span id="enemy-count"></span></div>
      <div class="res" id="res-wisps" title="위습 (라운드마다 3개) · 눌러서 디지바이스"><span class="ico-t">✨</span><span id="wisps"></span></div>
      <div class="res" title="목재"><img class="ico" id="wood-ico" alt=""><span id="wood"></span></div>
      <div class="res" title="골드"><img class="ico" data-img="gold" alt=""><span id="gold"></span></div>
      <button id="btn-book" title="조합표 (T)"><img class="ico" data-img="book" alt="">조합표</button>
      <button id="btn-chat" title="채팅 (Enter)">💬</button>
      <button id="btn-sound" title="소리">🔊</button>
      <button id="btn-pause" title="일시정지 (P)">⏸</button>
      <button id="btn-full" title="전체 화면">⛶</button>
    </header>

    <div id="players"></div>
    <div id="guide"><div id="g-island" class="g-line"></div><div id="g-target" class="g-line"></div></div>
    <div id="danger"></div>
    <div id="groups"></div>
    <div id="chat-log"></div>
    <div id="chat-box">
      <div class="chat-row"><input id="chat-input" type="text" maxlength="120" autocomplete="off" enterkeyhint="send" placeholder="메시지 입력 · Enter 보내기 · Esc 닫기 · -명령어" /><button id="chat-close" type="button">✕</button></div>
      <div id="chat-quick"></div>
    </div>
    <div id="messages"></div>
    <div id="boss-banner"></div>
    <div id="mode"></div>

    <aside id="side">
      <div id="info"></div>
      <div id="roster"><div class="rs-head"><b>내 디지몬</b><span id="rs-count" class="dim"></span><span id="rs-ready" class="rs-badge" hidden></span></div>
        <div id="rs-list"></div>
        <div id="rs-send"><div class="rs-send-h"><span id="rs-send-n">디지몬을 골라서 보내기 (＋로 여러 종류)</span></div>
          <div class="rs-send-b"><button data-to="lane" title="내 라인으로">🏠<small>라인</small></button><button data-to="story" title="스토리 보스 구역">📖<small>스토리</small></button><button data-to="boss" title="파일섬 보스 구역">👑<small>섬보스</small></button><button data-to="sea" title="심해 던전">🌊<small>심해</small></button><button data-to="tower" title="어둠의 탑">🗼<small>탑</small></button></div></div>
        <div class="rs-foot"><button id="rs-boss" class="btn pink small">⚔ 보스 집중</button><button id="rs-raid" class="btn small" title="강한 디지몬 40%를 섬 보스(없으면 스토리 보스)에게">🏝 공격대</button></div></div>
    </aside>
    <button id="boss-focus" class="btn pink" hidden></button>
    <footer id="hud">
      <div id="minimap-wrap"><canvas id="minimap"></canvas></div>
      <div id="commands"></div>
    </footer>

    <div id="tooltip"></div>

    <div id="book" class="overlay">
      <div class="panel wide">
        <div class="panel-head"><h2>조합표</h2><button class="x-btn" title="닫기 (T)" onclick="document.getElementById('btn-book').click()">✕</button></div>
        <div id="book-body"></div>
      </div>
    </div>

    <div id="picker" class="overlay">
      <div class="panel wide">
        <div class="panel-head"><h2 id="picker-title">선택권</h2><button id="picker-close" class="x-btn" title="닫기 (Esc)">✕</button></div>
        <div id="picker-body"></div>
      </div>
    </div>

    <div id="pause" class="overlay"><div class="panel"><h1>일시정지</h1><p class="dim">P 키로 계속</p>
      <div class="start-actions"><button id="btn-resume" class="btn gold">계속하기</button><button id="btn-giveup" class="btn pink">포기하기</button></div></div></div>
    <div id="online" class="overlay"><div class="panel wide online-panel"><div class="panel-head"><h2 id="online-title">함께하기</h2><button id="online-close" class="x-btn" title="닫기">✕</button></div><div id="online-body"></div></div></div>
    <div id="net-toast"></div>
    <div id="menu-modal" class="overlay"><div class="panel wide menu-panel"><div class="panel-head"><h2 id="mm-title"></h2><button id="mm-close" class="x-btn" title="닫기">✕</button></div><div id="mm-body"></div></div></div>
    <div id="end" class="overlay"></div>

    <div id="start" class="overlay show">
      <div class="start-bg"></div>
      <div class="start-hex"></div>
      <div class="start-shade"></div>
      <div id="version-badge"></div>
      <button id="me-chip" class="me-chip" title="프로필">
        <span class="me-icon"><img data-img="digivice" alt=""></span>
        <span class="me-text"><span class="nick">테이머</span><span class="exp"><i class="exp-tag">EXP</i> <b>0</b></span></span>
      </button>
      <div class="start-wrap">
        <div class="start-art">
          <img class="cone" data-img="ui_cone" alt="">
          <img class="isl isl2" data-img="island2" alt="">
          <img class="isl isl1" data-img="island" alt="">
          <img class="isl isl3" data-img="island3" alt="">
          <img class="ring" data-img="ui_ring" alt="">
          <img class="glow" data-img="ui_glow" alt="">
          <img class="dv" data-img="digivice" alt="">
        </div>
        <div class="start-menu">
          <div class="logo">
            <span class="logo-en">DIGITAL MONSTER RANDOM DEFENSE</span>
            <h1 class="logo-ko">디지 테이머</h1>
            <span class="logo-sub">디지몬 랜덤 디펜스</span>
          </div>
          <div id="loading">에셋 불러오는 중…</div>
          <div class="main-menu">
            <button id="btn-solo" class="btn gold big" disabled><img data-img="ui_icPlay" alt="">혼자하기</button>
            <button id="btn-together" class="btn big" disabled><img data-img="ui_icPeople" alt="">함께하기</button>
            <div class="menu-row">
              <button id="btn-shop" class="btn purple"><img data-img="ui_ruby" alt="">유물</button>
              <button id="btn-profile" class="btn navy"><img data-img="ui_icProfile" alt="">프로필</button>
              <button id="btn-rank" class="btn gold"><img data-img="ui_icStar" alt="">랭킹</button>
              <button id="btn-help" class="btn navy"><img data-img="ui_icHelp" alt="">방법</button>
            </div>
            <button id="btn-install" class="btn green install" hidden>📲 앱으로 설치</button>
          </div>
          <p id="install-hint" class="dim small" hidden>아이폰/아이패드: Safari 하단 <b>공유</b> 버튼 → <b>홈 화면에 추가</b></p>
        </div>
      </div>
      <p class="start-foot">비영리 팬게임입니다. 디지몬 관련 권리는 원저작권자에게 있습니다.</p>
    </div>

    </div>
    </div>
    <div id="rotate"><div class="phone"></div><div>화면을 <b>가로</b>로 돌려 주세요</div><small>디지 테이머는 가로 모드에서만 플레이할 수 있어요</small></div>
  </body>
</html>
